    .date {
      color: #aab0c7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;

      margin-top: 32px;
    }

    button {
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid #ffffff25;
      border-radius: 14px;
      background: #ffffff0d;
      color: #f5f6ff;
      font: inherit;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #ffffff1b;
    }

    button:focus-visible {
      outline: 3px solid #a78bfa;
      outline-offset: 3px;
    }

    button.primary {
      border-color: transparent;
      background: #7967ef;
    }

    button.primary:hover {
      background: #8979fa;
    }

    .message {
      min-height: 24px;
      margin: 20px 0 0;
      color: #c4b5fd;
    }

    @keyframes pulse {
      50% { opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }

<body>
  <main>
    <div class="badge"><span class="dot" aria-hidden="true"></span> الصفحة تعمل بنجاح</div>
    <h1>أهلًا بك 👋</h1>
    <p class="description">إذا ظهرت لك هذه الصفحة، فـ Live Server شغّال تمام!</p>

    <div class="clock" id="clock" aria-live="off">--:--:--</div>
    <div class="date" id="date"></div>

    <div class="actions">
      <button class="primary" id="testButton" type="button">جرّب الزر</button>
      <button id="refreshButton" type="button">حدّث الصفحة</button>
    </div>
    <p class="message" id="message" aria-live="polite"></p>
  </main>

  <script>
    const clock = document.getElementById("clock");
    const date = document.getElementById("date");
    const message = document.getElementById("message");
    let clicks = 0;

    function updateClock() {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString("ar", { hour12: false });
      date.textContent = now.toLocaleDateString("ar", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    document.getElementById("testButton").addEventListener("click", () => {
      clicks += 1;
      message.textContent = `ممتاز! الزر يعمل — عدد الضغطات: ${clicks}`;
    });

    document.getElementById("refreshButton").addEventListener("click", () => {
      window.location.reload();
    });

    updateClock();
    window.setInterval(updateClock, 1000);
  </script>
</body>
</html>
